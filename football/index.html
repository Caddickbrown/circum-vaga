.ri-next{display:flex;gap:4px;flex-wrap:wrap}.ri-opp{display:inline-flex;align-items:center;gap:2px}.ri-opp small{font-size:10px;color:var(--muted)}
.xi.capt{background:#d9a52e;color:#1c1b19}
.alsopl{text-transform:none;letter-spacing:0;font-weight:400;opacity:.8}

/* deadline day */
.dday{position:relative;width:min(760px,100%);max-height:92vh;overflow-y:auto;background:#f6efd9;color:#1c1b19;border:3px solid #1c1b19;box-shadow:10px 10px 0 rgba(0,0,0,.5);padding:18px 20px}
.dd-head{display:flex;justify-content:space-between;align-items:center;gap:14px;border-bottom:3px double #1c1b19;padding-bottom:10px;margin-bottom:10px}
.dd-head h2{font:400 clamp(30px,6vw,48px)/1 var(--f-disp);margin:2px 0;color:#c42b1c;text-transform:uppercase}
.dd-sub{margin:0;font-style:italic;font-size:14px}
.dd-clock{display:grid;justify-items:center;gap:4px;flex:none}.dd-clock svg{width:84px;height:84px}.dd-clock b{font:700 12px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:#c42b1c}
.dd-item{border-bottom:1px dashed #1c1b19;padding:10px 0}.dd-item h3{margin:0 0 6px;font:400 19px/1.2 var(--f-disp)}.dd-item p{margin:0 0 6px;font-size:15px}
.dd-item .btn{color:#1c1b19;border-color:#1c1b19;background:#fbf8ee}.dd-item .btn.go,.dd-foot .btn.go{background:#c42b1c;color:#fff6e6}
.dd-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}

/* intray filter */
.inf{display:flex;gap:0;border-bottom:1.5px solid var(--ink);position:sticky;top:0;background:var(--card);z-index:1}
.inf button{flex:1;padding:9px 8px;background:none;border:0;border-right:1px solid var(--line);font:700 12px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:inherit;cursor:pointer}
.inf button.on{background:var(--ink);color:var(--paper)}.inf button sup{background:var(--mustard);color:#1d1c19;border-radius:8px;padding:1px 5px;font-size:10px}
.inf .inf-mark{flex:none;text-transform:none;letter-spacing:0;font-weight:600;text-decoration:underline}
.inf-empty{padding:14px}

/* scouting */
.abil.est i{background:var(--red);opacity:.35}.abil.est b{display:block;height:7px;background:repeating-linear-gradient(45deg,var(--red) 0 3px,transparent 3px 6px);flex:none;margin-left:-6px}
.stars.unk{color:var(--muted);letter-spacing:3px}
.trials{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:8px 0}
.trialcard{display:grid;gap:4px;border:1.5px solid var(--ink);padding:10px;background:var(--paper)}.trialcard small{color:var(--muted)}.trialcard.signed{opacity:.6}
.fanzine{margin-top:14px;border:2px dashed var(--ink);padding:10px 12px;transform:rotate(-.6deg)}
.fz-t{margin:0;font:400 24px/1 var(--f-disp);text-transform:uppercase}.fz-s{margin:2px 0 6px;font-size:12px;color:var(--muted);font-style:italic}.fanzine ul{margin:0;padding-left:18px;font:700 13px 'Courier Prime',monospace}

/* letters from the bank */
.lt-head.bank{border-bottom-color:#1f4d2b}.bank-mark{width:44px;height:44px;display:grid;place-items:center;background:#1f4d2b;color:#f6efd9;font:700 26px 'Old Standard TT',Georgia,serif;border-radius:50%}

/* the scrapbook */
.album{background:#5a3a22;color:#f6efd9;border-color:#2c1c10;background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.06) 0 2px,transparent 2px 6px)}
.alb-cover{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;border:2px solid #d9a52e;padding:10px 14px;margin-bottom:14px}
.alb-cover span{font:italic 700 26px 'Old Standard TT',Georgia,serif;color:#f2c14e}.alb-cover small{opacity:.85}
.alb-spread{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;background:#efe6cc;padding:18px;border-radius:3px;box-shadow:inset 0 0 0 1px #c9b98f,inset 12px 0 18px -12px rgba(0,0,0,.35)}
.cutting{display:grid;gap:4px;align-content:start;text-align:left;background:#f8f2df;color:#1c1b19;border:1px solid #bba77a;padding:10px 12px;box-shadow:2px 3px 0 rgba(0,0,0,.18);transform:rotate(var(--rot));cursor:pointer;font-family:'Old Standard TT',Georgia,serif;min-width:0}
.cutting:hover{transform:rotate(0) scale(1.02)}.cutting small{font:700 10.5px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:#6b5a3a}
.cutting strong{font:400 17px/1.15 var(--f-disp);overflow-wrap:anywhere}.cutting span{font-size:13px;line-height:1.35}
.cutting.k-letter{background:#fbf8ee;font-family:'Courier Prime',monospace}.cutting.k-souvenir{border:2px solid #d9a52e}
.alb-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}.alb-nav .btn{color:#1c1b19;background:#f6efd9}
@media (max-width:760px){.alb-spread{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.alb-spread{grid-template-columns:minmax(0,1fr)}}
.retired p{font-size:17px;line-height:1.6}
.simbox{display:grid;gap:10px;justify-items:center;text-align:center;padding:30px 16px}.simbar{width:min(420px,100%);height:14px;border:2px solid var(--ink);background:var(--paper)}.simbar i{display:block;height:100%;background:var(--red)}
@media (max-width:560px){.dd-head{flex-wrap:wrap}.dd-clock{flex-direction:row;display:flex;align-items:center}.dd-clock svg{width:56px;height:56px}}
.spend{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.spend h4{margin:0 0 6px;font:400 17px/1.2 var(--f-disp)}.spend .btn small{font-weight:400;text-transform:none;letter-spacing:0}
.moodwhy{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.dd-art{margin:6px 0 10px}.dd-art .meetart,.meetart{display:block;width:100%;max-width:520px;height:auto;box-shadow:4px 4px 0 rgba(0,0,0,.35)}

/* calendar */
.contbox{display:flex;gap:8px;align-items:center}.simahead{background:transparent;color:#fff6e6;border-color:#fff6e6;box-shadow:none}
.cal-title{font:400 20px var(--f-disp);min-width:150px;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-h{font:700 11px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0}
.cal-d{display:flex;flex-direction:column;align-items:stretch;gap:3px;min-height:84px;padding:4px;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);text-align:left;cursor:pointer;font:inherit;min-width:0}
.cal-d:hover:not([disabled]){border-color:var(--ink)}.cal-d[disabled]{cursor:default}.cal-d.out{opacity:.4}.cal-d.past{background:transparent}
.cal-d.today{border:2.5px solid var(--red)}.cal-d.sel{background:var(--mustard);color:#1d1c19;border-color:var(--ink)}
.cal-n{font:700 12px var(--f-ui)}
.cal-fx{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--ink);padding:2px 3px;border-left:4px solid var(--ink);background:var(--card);min-width:0;overflow:hidden}
.cal-fx em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.cal-fx b{font-size:10px}.cal-fx i{font-style:normal;margin-left:auto}
.cal-fx.c-FA{border-left-color:#5b1420}.cal-fx.c-LC{border-left-color:#16482f}.cal-fx.c-EU{border-left-color:#12307a}.cal-fx.c-L{border-left-color:var(--red)}
.cal-fx .crest.sm{transform:scale(.8)}
.cal-mk{font:700 9.5px/1.2 var(--f-ui);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-mk.k-dd{color:var(--red)}.cal-mk.k-yt{color:var(--good)}.cal-mk.k-fa{color:#8a2a3a}.cal-mk.k-lc{color:#16482f}.cal-mk.k-end{color:var(--ink)}
.cal-leg{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.cal-leg .cal-fx{display:inline-flex}
.simpanel .row{margin-bottom:10px}
@media (max-width:620px){.cal-d{min-height:58px;padding:2px}.cal-fx em,.cal-mk{display:none}.cal-fx{padding:1px}.contbox .simahead{display:none}}

/* v24: bids, discipline, staff, photographs */
.bidcard{position:relative;width:min(720px,100%);max-height:92vh;overflow-y:auto;background:var(--card);color:var(--ink);border:3px solid var(--ink);box-shadow:10px 10px 0 rgba(0,0,0,.5)}
.bid-head{display:flex;align-items:center;gap:12px;background:#2c7a3a;color:#fff6e6;padding:12px 16px;border-bottom:3px solid var(--ink)}
.bid-head>div{display:flex;align-items:center;gap:10px}.bid-head h2{margin:0;font:400 clamp(20px,4vw,28px)/1.1 var(--f-disp)}
.bid-stamp{font:700 11px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;border:2px solid #fff6e6;padding:3px 6px;transform:rotate(-4deg);flex:none}
.bid-body{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:16px;padding:16px}.bid-por .reporter,.bid-por svg{width:100%;height:auto;display:block}
.bid-fee{font:400 26px/1 var(--f-disp);color:var(--good)}.bid-body small.up{color:var(--good)}.bid-body small.down{color:var(--bad)}
.bid-foot{display:flex;justify-content:flex-end;padding:0 16px 16px}
@media (max-width:560px){.bid-body{grid-template-columns:minmax(0,1fr)}.bid-por{max-width:150px}}
.tab sup.bidsup{background:#2c7a3a;color:#fff;animation:bidpulse 1.6s ease-in-out infinite}
@keyframes bidpulse{50%{transform:scale(1.25)}}
.bkt{background:#f2c14e;color:#1c1b19;font:700 10px var(--f-ui);padding:1px 4px;border-radius:2px;text-transform:uppercase}
.sc-status{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;font-size:13px}
.sc-xp{display:flex;align-items:center;gap:8px;margin-bottom:6px}.sc-xp span{font:700 11px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sc-xp i{flex:1;height:8px;border:1.5px solid var(--ink);background:var(--paper)}.sc-xp b{display:block;height:100%;background:var(--mustard)}
.sc-status dl{margin:0;display:grid;gap:3px}.sc-status dl div{display:grid;grid-template-columns:90px minmax(0,1fr);gap:6px}.sc-status dt{color:var(--muted)}.sc-status dd{margin:0}.sc-status dd.neg{color:var(--bad)}
.np-pic.photo{width:100%;height:auto;margin:0;display:block}

/* season review */
.review{display:grid;gap:16px;max-width:900px;margin:0 auto}
.rv-paper{width:100%;max-height:none;overflow:visible;box-shadow:8px 8px 0 rgba(0,0,0,.35)}
.rv-wire{width:100%;max-height:none}
.rv-chair{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:18px;align-items:start}.rv-chair-por .reporter{width:100%;height:auto;display:block}
.rv-chair .talkbtns .btn{white-space:normal;text-align:left}
.rv-poy{font-size:17px}.rv-nav{justify-content:flex-end;align-items:center}
@media (max-width:600px){.rv-chair{grid-template-columns:minmax(0,1fr)}.rv-chair-por{max-width:160px}}
.talk-ctx{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin:2px 0 8px}.talk-ctx b{color:var(--ink)}
.outlist{border:2px solid var(--bad);padding:8px 12px;margin:0 0 12px;background:rgba(179,38,30,.08)}.outlist p{margin:4px 0 0;font-size:14px}

/* v33: tactical depth */
.trtstar,.trtlist .trtstar{color:var(--mustard);font-size:15px;margin-left:2px}.chip:disabled{opacity:.4;cursor:not-allowed}.howtraits dt{font-weight:700}
.trt{display:inline-block;margin-left:4px;padding:1px 5px;font:600 10px/1.3 var(--f-ui);border:1px solid var(--line);border-radius:3px;color:var(--muted);vertical-align:middle;white-space:nowrap}
.trt.neg{color:var(--bad);border-color:currentColor}
.trtbox{margin:10px 0}.trtlist{list-style:none;padding:0;margin:6px 0;display:grid;gap:6px}.trtlist li{display:grid;gap:2px;padding:6px 8px;border-left:3px solid var(--good);background:rgba(44,122,58,.06)}
.trtlist li.neg{border-left-color:var(--bad);background:rgba(179,38,30,.06)}.trtlist strong{font-size:14px}.trtlist span{font-size:13px;color:var(--muted)}
.shirt .rtag{display:block;font:italic 600 10px/1.1 var(--f-ui);opacity:.85;margin-top:1px}
.rolepick{margin:10px 0;display:grid;gap:6px}.rolepick small{font-size:13px}
.tacgrp{margin:14px 0 4px;font:700 12px/1.2 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:3px}
.seg5 button{padding:6px 9px}.seg button:disabled{opacity:.35;cursor:not-allowed}
.sprow{display:grid;grid-template-columns:120px 1fr;gap:8px;align-items:center;margin:6px 0}.sprow select{max-width:100%}
.famrow{display:grid;grid-template-columns:minmax(90px,auto) 1fr auto;gap:10px;align-items:center;margin:10px 0 4px;font-size:14px}
.fambar{display:block;height:10px;border:1.5px solid var(--ink);background:transparent;min-width:60px}.fambar b{display:block;height:100%;background:linear-gradient(90deg,var(--bad),var(--mustard) 50%,var(--good))}
.famlist{list-style:none;padding:0;margin:6px 0;display:grid;gap:5px;font-size:13px}.famlist li{display:grid;grid-template-columns:1fr 120px;gap:8px;align-items:center}
.famother summary{cursor:pointer;font-size:13px;color:var(--muted)}
.dossier .dos-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.assist{border:2px solid var(--ink);padding:10px 12px;background:var(--card)}.assist ul{margin:6px 0 10px;padding-left:18px}.assist li{margin:4px 0;font-size:14px}
.bootsel{margin-top:12px;display:grid;gap:6px}
.aggbox{margin:10px auto 0;max-width:520px;border-top:1px solid var(--line);padding-top:8px}.aggbox p{margin:3px 0}.aggline{font-weight:700}
.aggl{display:block;font-size:12px;opacity:.85;margin-top:2px}.wxl{display:block;opacity:.8}
.shouts{display:grid;gap:6px;margin:10px 0}.shouts .chips{display:flex;flex-wrap:wrap;gap:6px}
.ltacd{margin:8px 0}.ltacd summary{cursor:pointer;font:600 14px/1.4 var(--f-ui)}
.chalk{position:fixed;inset:max(12px,3vh) 50% auto auto;transform:translateX(50%);width:min(980px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;z-index:60;
 background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.07),transparent 60%),radial-gradient(circle at 80% 90%,rgba(255,255,255,.04),transparent 50%),#2a3d31;color:#f4f1e8;border:14px solid #6b4a2b;box-shadow:inset 0 0 0 2px #3b2816,0 20px 60px rgba(0,0,0,.5);padding:18px 22px;font:20px/1.35 'Gochi Hand',var(--f-ui)}
.chalk .x{color:#f4f1e8}.chalk .btn{background:transparent;color:#f4f1e8;border-color:#f4f1e8;font-family:'Gochi Hand',var(--f-ui);font-size:18px}
.ck-head{text-align:center;margin-bottom:8px}.ck-t{font-size:40px;margin:0;letter-spacing:.04em;text-shadow:0 0 1px rgba(255,255,255,.5)}.ck-s{margin:0;font-size:20px;opacity:.9}
.ck-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.ck-h{font-size:24px;margin:12px 0 4px;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.ck-pitch{width:100%;height:auto;color:#f4f1e8}.ck-pitch text{fill:currentColor;font:18px 'Gochi Hand',sans-serif}
.ck-key{font-size:16px;opacity:.85;display:grid;gap:2px}.ck-us{color:#f4f1e8}.ck-them{color:#f2d46b}
.ck-tbl{width:100%;border-collapse:collapse;margin-top:6px;font-size:19px}.ck-tbl td,.ck-tbl th{padding:2px 6px;text-align:center;border-bottom:1px dashed rgba(244,241,232,.25)}.ck-tbl .l{text-align:left}
.ck-list{margin:4px 0;padding-left:20px}.ck-list li{margin:4px 0}.ck-adv li{color:#f2d46b}.ck-sm{font-size:17px;opacity:.85;margin:0}.ck-goals{list-style:none;padding:0;margin:0}.ck-goals span{display:inline-block;min-width:38px}
@media (max-width:760px){.dossier .dos-grid,.ck-grid{grid-template-columns:1fr}.chalk{border-width:8px;padding:12px;font-size:18px}.ck-t{font-size:32px}.sprow{grid-template-columns:1fr}}

/* v37 */
.mk{display:inline-block;padding:1px 6px;font:700 12px/1.3 var(--f-ui);border:1px solid currentColor}.mk-0{color:var(--muted)}.mk-1{color:var(--bad)}.mk-2{color:var(--warn)}.mk-3,.mk-4{color:var(--good)}
.fullbar{display:grid;gap:3px;border:2px solid var(--warn);background:rgba(168,111,7,.12);padding:9px 14px;margin:0 0 14px}.fullbar strong{font:700 13px/1.2 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--warn)}
.mdback{border-left:4px solid var(--good);padding:6px 10px;background:rgba(44,122,58,.1);margin:8px 0}
.negroom{width:min(680px,100%)}.negart .meetart{width:100%;height:auto;display:block;margin:8px 0}.negwho{font:600 14px/1.3 var(--f-ui);margin:0 0 8px}.negok{border-left:4px solid var(--good);padding-left:10px}.negdeal{border:2px solid var(--good);padding:8px 12px;display:grid;gap:6px;justify-items:start}.negfoot{margin-top:10px}.spnote{display:block;grid-column:1/-1;font-style:italic}
.main.wide{max-width:1480px}.tbl td.nm{white-space:normal;min-width:170px;max-width:290px;line-height:1.35}.tbl td.nm .trt{margin-top:2px}
.sfit{display:block;font:700 10px/1 var(--f-ui);font-style:normal;padding:2px 4px;border-radius:2px;background:rgba(0,0,0,.55);margin-top:1px}.sfit.f-ok{color:#8fe39c}.sfit.f-mid{color:#ffd166;background:rgba(60,40,0,.75)}.sfit.f-lo{color:#fff;background:#b3261e}
.fitp{font:700 13px/1 var(--f-ui);text-align:right;font-style:normal}.fitp.f-ok{color:var(--good)}.fitp.f-mid{color:var(--warn)}.fitp.f-lo{color:var(--bad)}.fitwarn{margin-top:10px;border-left:4px solid var(--warn);padding:6px 10px;background:rgba(168,111,7,.1);font-size:14px}
.acadtag{background:var(--good);color:#fff;padding:1px 6px;letter-spacing:.06em}
.askbox{margin-top:16px;border-top:2px solid var(--ink);padding-top:10px;display:grid;gap:6px;justify-items:start}.asknote{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border:1.5px dashed var(--ink);padding:8px 12px;margin:10px 0}.asknote p{margin:0}
@media (min-width:1000px){.tactics .tac-left{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto;display:grid;gap:18px;overscroll-behavior:contain}.tac-squad .tw{max-height:none}}
.tac-left{display:grid;gap:18px;align-content:start}
.setupbar{display:grid;gap:4px;border:2px solid var(--bad);background:rgba(179,38,30,.1);padding:10px 14px;margin:0 0 14px}.setupbar.ok{border-color:var(--good);background:rgba(44,122,58,.1)}
.need>.lbl,.need>label{color:var(--bad)}.need .seg,.need select,.row.need select{outline:2px solid var(--bad);outline-offset:2px}.need>small{color:var(--bad)}
.fapanel{border-top:6px solid #8a2a3a}.chip-fa.on{background:#8a2a3a;border-color:#8a2a3a;color:#fff}
.offers{display:grid;gap:12px;margin-top:12px}.offercard{border:2px solid var(--ink);padding:12px 14px;background:var(--card)}
.oc-h{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}.oc-who{display:grid;gap:2px}.oc-fee{text-align:right;display:grid}.oc-fee strong{font-size:22px}
.lnk{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;cursor:pointer;font-weight:700}
@media (max-width:600px){.oc-h{grid-template-columns:auto 1fr}.oc-fee{grid-column:1/-1;text-align:left}}
